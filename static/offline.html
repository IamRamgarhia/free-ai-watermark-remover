<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>WatermarkOut — Offline</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="centered-page">
  <main class="message-card">
    <img src="assets/logo.svg" alt="WatermarkOut" class="message-logo">
    <h1>You're offline</h1>
    <p class="text-muted">
      It looks like this is your first visit and the app hasn't finished loading yet.
      Reconnect to the internet and open WatermarkOut once — after that it works fully offline.
    </p>
    <button class="btn-primary" onclick="location.reload()">Try again</button>
    <p class="message-footer text-muted">
      Built by <a href="https://dicecodes.com">DiceCodes</a> · Made in India 🇮🇳
    </p>
  </main>
</body>
</html>
