# Verifies the site, then deploys static/ to GitHub Pages on every push to main.
#
# After enabling this workflow:
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. Push to main
#   3. App goes live at https://<username>.github.io/<repo>/
#
# Custom domain: put a CNAME file in static/ with your domain name.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: the pixel math and the cross-file consistency checks must pass before
  # anything ships. This runs on pull requests too, so a regression is caught
  # before it reaches main rather than after it is already live.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No dependencies, no install step — both scripts are plain ESM.
      - name: Inpainter pixel-math tests
        run: node tools/test-inpainter.mjs
      - name: Watermark detection tests
        run: node tools/test-detect.mjs
      - name: Un-blending recovery tests
        run: node tools/test-dewatermark.mjs
      - name: Texture fill tests
        run: node tools/test-texturefill.mjs
      - name: Static consistency checks
        run: node tools/check.mjs
      - name: Syntax-check every module
        run: |
          for f in static/js/*.js static/sw.js; do
            node --input-type=module --check < "$f" || exit 1
          done
          echo "All modules parse."

  deploy:
    needs: verify
    # Pull requests only get the verify gate; deploys happen on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Future-proof: GitHub deprecates Node 20 for actions on June 2, 2026.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
